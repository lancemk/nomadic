name: CI

on:
  pull_request:
    branches: [main, "develop/**"]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: ["**"]
    tags-ignore: ["v*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.12", "3.14"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project (core deps + dev tools, no MLX)
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run unit tests
        run: python -m pytest tests -q

      - name: Validate package build
        run: python -m build --sdist --wheel --outdir dist-ci

  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Lint shell scripts
        run: shellcheck -x install.sh scripts/*.sh

  binary-smoke:
    # Proves the PyInstaller binary builds, runs, and installs via install.sh.
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"
      - name: Build bundle
        env:
          NOMADIC_PLATFORM_ID_OVERRIDE: linux-x86_64
          NOMADIC_REQUIRE_BINARIES: "1"
        run: bash scripts/build_bundle.sh
      - name: Install from bundle and verify
        run: |
          tar -xzf artifacts/nomadic-*-linux-x86_64.tar.gz -C "${RUNNER_TEMP}"
          "${RUNNER_TEMP}"/nomadic-*-linux-x86_64/install.sh --prefix "${RUNNER_TEMP}/bin"
          "${RUNNER_TEMP}/bin/nomadic" --version
          "${RUNNER_TEMP}/bin/nomadic" --help >/dev/null
