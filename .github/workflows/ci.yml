name: CI

on:
  pull_request:
    branches:
      - main
      - "develop/**"
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  push:
    branches:
      - "**"
    tags-ignore:
      - "v*"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: (github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')) && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-14
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install test tooling
        run: python -m pip install --upgrade pip build

      - name: Install project for test
        run: python -m pip install --no-deps -e .

      - name: Install runtime test dependencies
        run: python -m pip install requests rich prompt-toolkit psycopg

      - name: Run unit tests
        run: python -m unittest -q

      - name: Validate package build
        run: python -m build --sdist --wheel --outdir dist-ci
