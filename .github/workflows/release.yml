name: Release

# Builds standalone binaries for every supported platform and publishes them to
# a GitHub Release together with SHA256SUMS and install.sh.
# Triggered by: a pushed v* tag, or dispatched by post_merge.yml / manually.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build and publish, e.g. v0.2.0"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-24.04,     platform_id: linux-x86_64 }
          - { os: ubuntu-24.04-arm, platform_id: linux-arm64 }
          - { os: macos-14,         platform_id: macos-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - name: Verify tag matches pyproject version
        run: |
          python -m pip install --quiet packaging
          python - <<'PY'
          import os, tomllib
          from packaging.version import Version
          tag = os.environ["RELEASE_TAG"]
          project = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          # PEP 440 normalisation: tag v0.4.0-rc.1 == pyproject 0.4.0rc1
          assert Version(tag.lstrip("v")) == Version(project), f"Tag {tag} != pyproject version {project}"
          PY

      - name: Install project and build tooling
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build bundle
        env:
          NOMADIC_PLATFORM_ID_OVERRIDE: ${{ matrix.platform_id }}
          NOMADIC_REQUIRE_BINARIES: "1"
        run: bash scripts/build_bundle.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform_id }}
          path: artifacts/nomadic-*.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: actions/download-artifact@v4
        with:
          pattern: bundle-*
          path: dist-release
          merge-multiple: true

      - name: Assemble checksums
        run: |
          cd dist-release
          cat ./*.sha256 | sort -k2 > SHA256SUMS
          rm -f ./*.sha256
          cp ../install.sh .
          ls -l

      - name: Extract release notes
        run: |
          # Prefer this version's changelog section; fall back to [Unreleased].
          python - <<'PY' > release-notes.md
          import os, re, pathlib
          text = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          ver = os.environ["RELEASE_TAG"].lstrip("v")
          for head in (rf"## \[{re.escape(ver)}\][^\n]*", r"## \[Unreleased\][^\n]*"):
              m = re.search(head + r"\n(.*?)(?=\n## \[|\Z)", text, re.S)
              if m and m.group(1).strip():
                  print(m.group(1).strip()); break
          else:
              print(f"Release {os.environ['RELEASE_TAG']}")
          PY

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags with a pre-release segment (v0.4.0-rc.1, v0.4.0-staging.2) are published as
          # GitHub pre-releases: invisible to /releases/latest, installable via
          # `install.sh --channel rc|staging` or `--version <tag>`.
          PRERELEASE_FLAG=""
          if [[ "${RELEASE_TAG}" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; fi
          if gh release view "${RELEASE_TAG}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" dist-release/* --clobber
          else
            gh release create "${RELEASE_TAG}" dist-release/* \
              --title "${RELEASE_TAG}" --notes-file release-notes.md --verify-tag ${PRERELEASE_FLAG}
          fi
