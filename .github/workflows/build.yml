name: Build Bundles

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metadata:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Generate release metadata
        run: |
          mkdir -p artifacts
          python - <<'PY'
          import json
          import pathlib
          import tomllib
          import os

          root = pathlib.Path.cwd()
          version = tomllib.loads((root / "pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          ref = os.environ["GITHUB_REF"]
          ref_name = os.environ["GITHUB_REF_NAME"]
          payload = {
              "version": version,
              "git_ref": ref,
              "ref_name": ref_name,
              "is_tag": ref.startswith("refs/tags/"),
              "tag_name": ref_name if ref.startswith("refs/tags/") else "",
          }
          (root / "artifacts" / "release-metadata.json").write_text(
              json.dumps(payload, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload release metadata
        uses: actions/upload-artifact@v4
        with:
          name: release-metadata
          path: artifacts/release-metadata.json

  build:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, '[skip ci]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform_id: linux-x86_64
          - os: macos-14
            platform_id: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: python -m pip install --upgrade pip build

      - name: Build release bundle
        env:
          NOMADIC_PLATFORM_ID_OVERRIDE: ${{ matrix.platform_id }}
        run: bash scripts/build_bundle.sh

      - name: Upload platform bundle
        uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.platform_id }}
          path: artifacts/nomadic-*.tar.gz
